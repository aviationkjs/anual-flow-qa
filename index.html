<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매뉴얼 흐름 Q&amp;A</title>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
<style>
  /* 디자인 토큰 — Astryx(neutral) 설계 방식을 따름: 중립 표면 + 역할별 상태색, 반경 inner/element/container, 모바일에서 본문 16px */
  :root{
    --bg:#f4f4f5; --card:#ffffff; --ink:#111827; --sub:#525b6b; --line:rgba(0,0,0,.08); --line-strong:#d4d7dd;
    --brand:#0074e2; --brand-soft:#e6f1fc;
    --warn:#c9303a; --warn-soft:#fbe9ea; --caut:#7a5b00; --caut-soft:#fff4c2; --caut-fill:#ffce2f;
    --ok:#198100; --ok-soft:#e6f4e2; --q:#6741d9; --q-soft:#efeafb;
    --header:#18181b;
    --r-inner:6px; --r-el:10px; --r-box:12px; --r-page:28px;
    --fs:14px; --fs-sm:12.5px; --fs-lg:16px; --fs-h2:20px; --fs-h3:16px;
    --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media(pointer:coarse),(max-width:560px){ :root{--fs:16px; --fs-sm:13.5px; --fs-lg:17px; --fs-h2:21px; --fs-h3:17px} }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
  header{position:sticky;top:0;z-index:20;background:var(--header);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{font-size:17px;margin:0 12px 0 0;font-weight:700}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:9px}
  .tabs button{border:0;background:transparent;color:#c9d3e6;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px;font-family:inherit}
  .tabs button.on{background:#fff;color:var(--header);font-weight:700}
  .badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center}
  header select{margin-left:auto;padding:7px 10px;border-radius:var(--r-el);border:0;font-family:inherit;font-size:14px;max-width:100%}
  main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
  .task-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .task-head h2{margin:0 0 6px;font-size:var(--fs-h2);line-height:1.35;letter-spacing:-.01em}
  .meta{color:var(--sub);font-size:var(--fs-sm);line-height:1.5}
  .notice{margin-top:12px;font-size:var(--fs-sm);background:var(--caut-soft);border:1px solid #f1dc8a;border-radius:var(--r-el);padding:9px 12px;color:var(--caut);line-height:1.55}
  a{color:var(--brand)}
  .step{background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:16px 18px;position:relative;box-shadow:var(--shadow)}
  .step.warning{border-left:5px solid var(--warn)}
  .step.caution{border-left:5px solid var(--caut-fill)}
    .step-top{display:flex;gap:10px;align-items:flex-start}
  .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .step h3{margin:4px 0 8px;font-size:var(--fs-h3);line-height:1.35}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-inner);margin-right:6px;vertical-align:middle;letter-spacing:.02em}
  .tag.warning{background:var(--warn-soft);color:var(--warn)}
  .tag.caution{background:var(--caut-fill);color:#3b2f00}
  .tag.ref{background:#f1f2f4;color:var(--sub);font-weight:500;white-space:normal;line-height:1.5}
  .body{white-space:pre-wrap}
  ul.body{list-style:none;margin:0;padding:0;white-space:normal}
  ul.body li{position:relative;padding-left:16px;margin:0 0 6px;line-height:1.6}
  ul.body li:last-child{margin-bottom:0}
  ul.body li:before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .step.warning ul.body li:before{background:var(--warn)}
  .step.caution ul.body li:before{background:#c99a00}
  .media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
  .media figure{margin:0;border:1px solid var(--line);border-radius:var(--r-el);overflow:hidden;background:#fafbfc;position:relative}
  .media img,.media svg{display:block;width:100%;height:120px;object-fit:cover;cursor:zoom-in}
  .media svg{object-fit:contain;background:#fff}
  .media figcaption{font-size:11.5px;color:var(--sub);padding:3px 6px}
  .media .del{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;font-size:11px;padding:2px 6px;cursor:pointer}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  button.btn{border:1px solid var(--line-strong);background:#fff;border-radius:var(--r-el);padding:8px 13px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink);min-height:36px}
  button.btn:hover{background:#f2f4f8}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{background:#005fba}
  button.qbtn{background:var(--q-soft);border-color:#d9cff5;color:var(--q);font-weight:600}
  button.okbtn{background:var(--ok);border-color:var(--ok);color:#fff}
  .supp{margin-top:12px;background:var(--ok-soft);border:1px solid #bfe0b5;border-radius:var(--r-el);padding:10px 12px;line-height:1.55}
  .supp .lbl{font-size:12px;font-weight:700;color:var(--ok)}
  .supp .q{font-size:13px;color:var(--sub);margin:2px 0}
  .pending{margin-top:8px;font-size:12.5px;color:var(--q)}
  .gap{display:flex;flex-direction:column;align-items:center;padding:4px 0}
  .gap .line{width:2px;height:12px;background:#c4cad6}
  .gap button{border:1px dashed #b9a6df;background:transparent;color:var(--q);border-radius:20px;padding:2px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.75}
  .gap button:hover{opacity:1;background:var(--q-soft)}
  .gapq{width:100%;background:var(--q-soft);border:1px solid #d9cff5;border-radius:var(--r-el);padding:9px 12px;margin:4px 0;font-size:var(--fs-sm);line-height:1.55}
  .qitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
  .qitem .where{font-size:12.5px;color:var(--sub)}
  .qitem .text{font-weight:600;margin:4px 0}
  .score{float:right;text-align:right}
  .score b{font-size:22px;color:var(--ink)}
  .score small{display:block;color:var(--sub);font-size:11px}
  .chips span{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:#eef0f4;color:var(--sub);margin:2px 4px 0 0}
  .chips span.hot{background:var(--warn-soft);color:var(--warn);font-weight:700}
  .status{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;font-weight:700}
  .st-open{background:var(--q-soft);color:var(--q)} .st-answered{background:var(--caut-soft);color:var(--caut)}
  .st-applied{background:var(--ok-soft);color:var(--ok)} .st-manual{background:#eef0f4;color:var(--sub)}
  .ans{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px}
  .subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .subtabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px}
  .subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .subtabs button{min-height:34px}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:var(--r-el);padding:10px 12px;font-size:var(--fs-sm);color:var(--sub);margin-bottom:12px;line-height:1.55}
  textarea,input[type=text]{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-el);padding:9px 11px;font-family:inherit;font-size:16px;background:#fff}
  textarea:focus,input[type=text]:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  textarea{min-height:80px;resize:vertical}
  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:10px 0 4px}
  .modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:20px}
  .modal h3{margin:0 0 6px}
  .similar{background:#faf8fe;border:1px solid #e6dcf6;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
  .similar div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;padding:20px}
  #lightbox.show{display:flex}
  #lightbox img,#lightbox svg{max-width:95vw;max-height:90vh;background:#fff;border-radius:6px}
  .empty{color:var(--sub);text-align:center;padding:30px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--header);color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
  .toast.show{opacity:1}
  .admin-step{background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:14px 16px;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}header select{margin-left:0;width:100%}}
</style>
<style>
  /* ---- 3D 뷰어 ---- */
  .btn3d{background:var(--brand-soft);border-color:#b9d6f5;color:var(--brand);font-weight:600}
  #viewerBg{position:fixed;inset:0;background:rgba(10,15,30,.7);display:none;z-index:55;align-items:center;justify-content:center;padding:12px}
  #viewerBg.show{display:flex}
  #viewer{background:#fff;border-radius:14px;width:min(980px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden}
  #viewer .vhead{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  #viewer .vhead b{font-size:15px;margin-right:auto}
  #vbody{flex:1;display:flex;min-height:0}
  #vcanvasWrap{flex:1;position:relative;background:linear-gradient(#f7f9fc,#e4e9f1);min-width:0}
  #vcanvasWrap canvas{display:block;width:100%;height:100%;touch-action:none}
  #vside{width:270px;border-left:1px solid var(--line);padding:10px 12px;overflow:auto;font-size:13px;display:none}
  #vside.show{display:block}
  #vside h4{margin:10px 0 6px;font-size:13px;color:var(--sub)}
  .vnote{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#5b6475;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px}
  .vinfo{position:absolute;left:10px;top:8px;font-size:12px;color:#1d2330;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px}
  .vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);padding:20px;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-100%);background:#c62828;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .pin:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#c62828}
  .pinrow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
  .on-mode{background:#c62828!important;color:#fff!important;border-color:#c62828!important}
  .drop{border:2px dashed #b9c4d6;border-radius:8px;padding:10px;text-align:center;color:var(--sub);font-size:12.5px;margin-top:6px}
  .drop.over{background:var(--brand-soft);border-color:var(--brand)}
  @media(max-width:700px){#vbody{flex-direction:column}#vside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:42%}}
  /* ---- 챗봇 ---- */
  #chatFab{position:fixed;right:18px;bottom:18px;z-index:40;border:0;border-radius:var(--r-page);background:var(--header);color:#fff;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);font-family:inherit}
  #chat{position:fixed;right:18px;bottom:78px;z-index:45;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100vh - 110px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none;flex-direction:column;overflow:hidden}
  #chat.show{display:flex}
  #chat .chead{background:var(--header);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px}
  #chat .chead b{margin-right:auto}
  #chat .chead button{background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer}
  #chat .cwarn{font-size:12px;background:var(--caut-soft);color:var(--caut);padding:6px 10px;border-bottom:1px solid #f1dc8a;line-height:1.5}
  #chatLog{flex:1;overflow:auto;padding:10px;background:#f7f8fa;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;line-height:1.55}
  .bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .bub.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .hit{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-top:6px;background:#fafbfc;white-space:normal}
  .hit .ht{font-weight:700;color:var(--brand);cursor:pointer;text-decoration:underline}
  .hit .hs{color:var(--sub);font-size:12.5px;margin-top:2px}
  .hit .hq{font-size:12.5px;margin-top:4px;background:var(--ok-soft);border-radius:6px;padding:4px 6px}
  .hit .hw{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:2px}
  .cmini{font-size:12px;padding:3px 9px;margin:6px 4px 0 0}
  #chatForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  #chatForm input{flex:1}
  .flash{animation:flash 1.6s ease 1}
  @keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px #ffd54f}}
</style>
</head>
<body>
<header>
  <h1>📘 매뉴얼 흐름 Q&amp;A</h1>
  <div class="tabs" id="roleTabs">
    <button data-role="tech">정비사</button>
    <button data-role="sup">감독자<span class="badge-n" id="supBadge"></span></button>
    <button data-role="admin">관리</button>
  </div>
  <select id="taskSel"></select>
</header>
<main id="app"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="lightbox"></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>

<!-- 3D 뷰어 -->
<div id="viewerBg"><div id="viewer">
  <div class="vhead">
    <b id="vTitle">3D 도면</b>
    <button class="btn" id="vReset">처음 시점</button>
    <button class="btn" id="vWire">와이어프레임</button>
    <button class="btn" id="vFull">전체화면</button>
    <button class="btn" id="vClose">닫기 ✕</button>
  </div>
  <div id="vbody">
    <div id="vcanvasWrap"><div class="vinfo" id="vInfo"></div><div class="vmsg" id="vMsg"></div><div id="vPins"></div>
      <div class="vnote">참고용 형상입니다. 치수와 작업 기준은 매뉴얼 원문을 따르세요. · 드래그: 회전 · 휠/두 손가락: 확대 · 우클릭/세 손가락: 이동</div></div>
    <div id="vside"></div>
  </div>
</div></div>

<!-- 챗봇 -->
<button id="chatFab">💬 매뉴얼 챗봇</button>
<div id="chat">
  <div class="chead"><b>💬 매뉴얼 챗봇</b><button id="chatClose" title="닫기">✕</button></div>
  <div class="cwarn">등록된 매뉴얼과 승인된 보충설명에서만 찾아 답합니다. 작업 기준은 매뉴얼 원문입니다.</div>
  <div id="chatLog"></div>
  <form id="chatForm"><input type="text" id="chatIn" placeholder="예: 리벳 홀이 커졌어요" autocomplete="off"><button class="btn primary">보내기</button></form>
</div>

<script>
/* ===================== 그림(예시용 자체 제작 SVG) ===================== */

const H = 3600e3;
const FALLBACK_TASKS = [{"id": "t1", "title": "동체 외판(스킨) 손상 부위 판금 교체 — 리벳 제거·신품 장착", "model": "예시: 민항기 알루미늄 동체 외판 (알클래드 2024-T3 기준)", "freq": "적용 시점: 손상이 SRM 허용 한계를 넘어 수리 대신 교체가 지정된 경우", "refs": [{"label": "FAA-H-8083-31B 항공정비사 핸드북–기체, 4장 금속 구조 수리", "url": "https://www.faa.gov/regulations_policies/handbooks_manuals/aviation"}, {"label": "FAA AC 43.13-1B 4장 4절 금속 수리 절차 (4-57 리벳 작업)", "url": "https://www.faa.gov/airports/resources/advisory_circulars/index.cfm/go/document.information/documentNumber/43.13-1B"}], "steps": [{"id": "s1", "title": "작업 준비 · 안전 조치", "caution": "warning", "ref": "AMM 20장 표준 작업 / SRM 51장 일반 주의사항", "illu": "safety", "photos": [], "body": "작업지시서(Task Card)와 해당 기종 SRM·AMM 절차를 먼저 확인한다.\n항공기 접지, 전원 OFF 및 태그 아웃. 연료·산소 계통 인접 구역이면 해당 계통 안전 조치를 먼저 한다.\n보안경·귀마개·장갑 착용. 드릴 칩이 날리는 구역에는 다른 작업자를 두지 않는다."}, {"id": "s2", "title": "손상 평가 · 교체 판정", "caution": null, "ref": "FAA-H-8083-31B 4장 손상 검사·분류 / SRM 허용 손상 한계", "illu": "assess", "photos": [], "body": "손상 크기·깊이·위치를 측정하고 균열·부식 여부를 확인한다. 필요하면 NDI(와전류·침투탐상)를 의뢰한다.\nSRM의 허용 손상 한계(Allowable Damage)와 비교해 무시 가능 / 수리 / 교체 중 어디인지 판정한다.\n교체로 판정되면 교체 범위(패널 경계, 리벳 열)를 SRM 도면에서 확정하고 사진을 남긴다."}, {"id": "s3", "title": "접근 확보 · 주변 보호", "caution": null, "ref": "AMM 해당 구역 접근 절차 (예: 53장 동체)", "illu": "access", "photos": [], "body": "인접 페어링·패널·내장재를 제거해 작업 부위 안팎 양쪽에 접근할 수 있게 한다.\n내부 배선·배관·장비는 테이프와 보호 커버로 덮고, 드릴 칩이 떨어지지 않도록 흡입기 또는 받침을 준비한다.\n제거한 부품과 패스너는 위치를 표시해 보관한다."}, {"id": "s4", "title": "기존 리벳 제거", "caution": "caution", "ref": "FAA-H-8083-31B 4장 리벳 제거(Removal of Rivets)", "illu": "drill", "photos": [], "body": "리벳 머리 중심을 센터펀치로 찍고, 리벳 생크보다 한 치수 작은 드릴로 머리 두께만큼만 드릴한다.\n핀 펀치로 머리를 떼어 낸 뒤, 반대편에 백업 블록을 대고 생크를 밀어낸다.\n드릴이 생크를 관통하거나 홀이 커지지 않도록 한다. 홀이 커진 곳은 표시해 두고 다음 단계에서 처리한다."}, {"id": "s5", "title": "손상 부품 탈거 · 홀과 하부 구조 점검", "caution": null, "ref": "SRM 51장 부식 처리 / 홀 상태 검사", "illu": "inspect", "photos": [], "body": "손상 외판을 떼어 내고 스트링어·프레임 등 하부 구조에 손상이나 부식이 없는지 확인한다.\n기존 홀을 핀 게이지로 점검한다. 길쭉하거나 커진 홀은 SRM 지정 오버사이즈 리벳 홀로 가공한다.\n부식은 SRM 지정 방법으로 제거하고 처리 후 두께가 한계 이내인지 확인한다."}, {"id": "s6", "title": "교체 부품 제작 · 가공", "caution": null, "ref": "AC 43.13-1B 4-53 대체 알루미늄 선정 / 4-54~56 성형", "illu": "fabricate", "photos": [], "body": "SRM이 지정한 재질·두께(예: 2024-T3 알클래드)로 기존 부품과 같은 결 방향으로 재단한다.\n굽힘이 있으면 최소 굽힘 반경과 세트백을 계산해 성형한다.\n모서리는 둥글게 다듬고 모든 절단면을 디버링한다. 긁힘·찍힘은 응력 집중을 만들므로 남기지 않는다."}, {"id": "s7", "title": "홀 가공 · 클레코 가고정", "caution": null, "ref": "AC 43.13-1B 4-57 리벳 간격·연거리", "illu": "cleco", "photos": [], "body": "신품을 맞대고 기존 홀을 따라 파일럿 드릴 후 최종 치수로 확공한다. 새 홀은 원래 구조와 같은 피치·연거리를 따른다.\n기준이 없을 때의 최소값: 연거리 2D 이상, 단열 리벳 간격 3D 이상 (D = 리벳 지름).\n2~3홀마다 클레코로 가고정해 틈새와 맞물림을 확인한 뒤, 분리해 양쪽 접합면을 디버링한다."}, {"id": "s8", "title": "부식 방지 처리 · 실란트 도포", "caution": "caution", "ref": "SRM 51장 표면 처리·실링 / AMM 20장", "illu": "seal", "photos": [], "body": "가공면과 홀 주변을 세척하고 SRM 지정 화성 피막(알로다인) 처리 후 프라이머를 도포한다.\n접합면(페잉 서피스)에 지정 실란트를 바른다. 실란트 작업 가능 시간 안에 리벳 작업을 끝낸다.\n실란트가 홀 안으로 과하게 들어가지 않도록 한다."}, {"id": "s9", "title": "리벳 장착", "caution": "caution", "ref": "AC 43.13-1B 4-57 리벳 작업 / FAA-H-8083-31B 4장 리벳 설치", "illu": "rivet", "photos": [], "body": "리벳 종류·지름은 SRM 지정을 따른다. 일반 기준은 지름 ≈ 접합 판 중 두꺼운 쪽 두께의 3배, 길이 = 그립 + 1.5D.\n버킹바를 리벳 축에 직각으로 밀착하고 리벳건으로 성형한다. 숍 헤드 기준: 지름 1.5D, 높이 0.5D.\n블라인드 리벳은 제작사 승인이 있을 때만 쓴다. 변형·균열·기울어진 리벳은 즉시 제거하고 다시 장착한다."}, {"id": "s10", "title": "검사 · 마무리 · 기록", "caution": null, "ref": "AMM 20장 작업 후 검사 / 정비 기록 규정", "illu": "check", "photos": [], "body": "리벳 게이지로 머리 치수를 전수 검사하고, 판 사이 틈·들뜸·균열이 없는지 확인한다.\n넘친 실란트를 정리하고 지정 도장을 한다. 보호 커버를 걷고 FOD(칩·공구·패스너) 점검을 한다.\n작업 카드·테크 로그에 기록하고 검사원 서명(RII 해당 시)을 받는다. 제거한 패널·페어링을 원위치한다."}]}];

const KEY='manual-flow-qa-v3';
let S, FILE_TASKS=null, SYN=FALLBACK_SYN, REPO_MODELS=[], FILE_LINKS=[], LOCAL_MODELS=[];
const clone=o=>JSON.parse(JSON.stringify(o));
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('저장 공간이 부족합니다. 사진 수를 줄이거나 JSON으로 내보내 주세요.'); } }
async function getJSON(url){ const r=await fetch(url,{cache:'no-cache'}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function boot(){
  try{ FILE_TASKS=(await getJSON('data/manual.json')).tasks; }catch(e){ FILE_TASKS=null; }
  try{ SYN=(await getJSON('data/synonyms.json')).groups; }catch(e){}
  try{ const m=await getJSON('models/models.json'); REPO_MODELS=m.models||[]; FILE_LINKS=m.links||[]; }catch(e){}
  try{ LOCAL_MODELS=await idbAll(); }catch(e){ LOCAL_MODELS=[]; }
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  S = saved || {role:'tech',taskId:'t1',tasks:clone(FILE_TASKS||FALLBACK_TASKS),questions:demoQuestions(),linkEdits:{}};
  S.linkEdits=S.linkEdits||{};
  render();
}

/* ===================== IndexedDB (브라우저에 올린 STL) ===================== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('mfqa-stl',1);r.onupgradeneeded=()=>r.result.createObjectStore('stl',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(rec){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('stl','readwrite');t.objectStore('stl').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbGet(id){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('stl').objectStore('stl').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDel(id){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('stl','readwrite');t.objectStore('stl').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('stl').objectStore('stl').getAll();q.onsuccess=()=>res(q.result.map(r=>({id:r.id,name:r.name,file:r.fileName,local:true,size:r.data.byteLength})));q.onerror=()=>rej(q.error);});}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const task=()=>S.tasks.find(t=>t.id===S.taskId)||S.tasks[0];
const stepOf=(t,id)=>t.steps.find(s=>s.id===id);
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<60)return m+'분 전';const h=Math.round(m/60);return h<48?h+'시간 전':Math.round(h/24)+'일 전';}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
const allModels=()=>[...REPO_MODELS,...LOCAL_MODELS];
const modelById=id=>allModels().find(m=>m.id===id);
const linkKey=(tid,sid)=>tid+'|'+sid;
function linkFor(tid,sid){
  const k=linkKey(tid,sid);
  if(S.linkEdits[k]!==undefined) return S.linkEdits[k];
  return FILE_LINKS.find(l=>l.task===tid&&l.step===sid)||null;
}
function hasModels(tid,sid){const l=linkFor(tid,sid);return !!(l&&l.models&&l.models.some(id=>modelById(id)));}

function readImages(files){
  return Promise.all([...files].map(f=>new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,1000/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res({id:uid(),src:c.toDataURL('image/jpeg',.75),name:f.name});
    };img.onerror=()=>res(null);img.src=fr.result;};
    fr.readAsDataURL(f);
  }))).then(a=>a.filter(Boolean));
}
function pickImages(){return new Promise(res=>{const p=$('#filePick');p.value='';p.onchange=()=>readImages(p.files).then(res);p.click();});}
function bodyHTML(b){const lines=String(b||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);return lines.length>1?`<ul class="body">${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:`<div class="body">${esc(lines[0]||'')}</div>`;}
function mediaHTML(photos,illu,opts={}){
  const items=[];
  if(illu&&ILLU[illu]) items.push(`<figure><div data-illu="${illu}">${ILLU[illu]}</div><figcaption>예시 그림</figcaption></figure>`);
  (photos||[]).forEach(p=>items.push(`<figure><img src="${p.src}" data-zoom alt="">${opts.del?`<button class="del" data-delphoto="${p.id}" data-owner="${opts.del}">삭제</button>`:''}<figcaption>${esc(p.name||'사진')}</figcaption></figure>`));
  return items.length?`<div class="media">${items.join('')}</div>`:'';
}

/* ===================== 우선순위 점수 ===================== */
function scoreOf(q){
  const t=S.tasks.find(x=>x.id===q.taskId); const st=t&&stepOf(t,q.stepId);
  const safety = st&&st.caution==='warning'?40:st&&st.caution==='caution'?20:0;
  const stop = q.stopped?40:0;
  const metoo = Math.min(q.metoo,5)*8;
  const wait = Math.min(Math.floor((Date.now()-q.createdAt)/H),20);
  return {total:safety+stop+metoo+wait,safety,stop,metoo,wait};
}

async function addLocalStl(files){
  let n=0;
  for(const f of files){
    if(!/\.stl$/i.test(f.name)){toast('STL 파일만 넣을 수 있습니다: '+f.name);continue;}
    if(f.size>100*1048576){toast('100MB가 넘는 파일은 넣을 수 없습니다: '+f.name);continue;}
    const data=await f.arrayBuffer();
    try{ await idbPut({id:'local-'+uid(),name:f.name.replace(/\.stl$/i,''),fileName:f.name,data}); n++; }catch(e){ toast('브라우저 저장 공간이 부족합니다'); }
    if(f.size>20*1048576) toast(f.name+'은 20MB가 넘어 휴대폰에서 느릴 수 있습니다');
  }
  LOCAL_MODELS=await idbAll(); render(); if(n) toast(`STL ${n}개를 넣었습니다. 아래 Step에서 연결하세요.`);
}

  const {THREE,OrbitControls}=V;
  const wrap=$('#vcanvasWrap');
  if(!V.renderer){
    V.renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
    V.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    wrap.prepend(V.renderer.domElement);
    V.scene=new THREE.Scene();
    V.camera=new THREE.PerspectiveCamera(40,1,0.01,100000); V.camera.up.set(0,0,1);
    V.controls=new OrbitControls(V.camera,V.renderer.domElement); V.controls.enableDamping=true;
    V.scene.add(new THREE.HemisphereLight(0xffffff,0x8090a0,1.6));
    const d1=new THREE.DirectionalLight(0xffffff,1.6); d1.position.set(1,-2,3); V.scene.add(d1);
    const d2=new THREE.DirectionalLight(0xffffff,0.6); d2.position.set(-2,1,-1); V.scene.add(d2);
    V.renderer.domElement.addEventListener('pointerdown',e=>{V._down=[e.clientX,e.clientY];});
    V.renderer.domElement.addEventListener('pointerup',onCanvasClick);
    new ResizeObserver(resizeViewer).observe(wrap);
  }
  if(V.group){ V.scene.remove(V.group); V.group.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose();}); }
  V.group=new THREE.Group(); V.scene.add(V.group); V.meshes=[]; V.edit=!!edit; V.tid=tid; V.sid=sid; V.pinMode=false; V.wire=false;
  resizeViewer();
  const link=linkFor(tid,sid); const ids=(link?.models||[]).filter(id=>modelById(id));
  if(!ids.length){ $('#vMsg').textContent='이 단계에 연결된 3D 모델이 없습니다.'; renderSide(); loop(); return; }
  try{
    for(let k=0;k<ids.length;k++){
      const m=modelById(ids[k]);
      $('#vMsg').textContent=`불러오는 중: ${m.name} (${k+1}/${ids.length})`;
      const geo=await loadGeometry(m,p=>{$('#vMsg').textContent=`불러오는 중: ${m.name} ${p}%`;});
      geo.computeVertexNormals();
      const mat=new THREE.MeshStandardMaterial({color:PALETTE[k%PALETTE.length],metalness:.35,roughness:.55,side:THREE.DoubleSide});
      const mesh=new THREE.Mesh(geo,mat); mesh.userData.modelId=m.id; V.group.add(mesh); V.meshes.push(mesh);
    }
  }catch(e){ console.error(e); $('#vMsg').innerHTML='STL 파일을 읽지 못했습니다.<br>파일 이름과 models.json의 file 값이 같은지 확인해 주세요.'; renderSide(); loop(); return; }
  $('#vMsg').textContent='';
  // 가운데로 맞추기
  const box=new THREE.Box3().setFromObject(V.group); const c=box.getCenter(new THREE.Vector3()); const size=box.getSize(new THREE.Vector3());
  V.group.position.sub(c); V.size=size; V.radius=size.length()/2||1;
  const tris=V.meshes.reduce((a,m)=>a+m.geometry.attributes.position.count/3,0);
  $('#vInfo').textContent=`크기 ${fmt(size.x)} × ${fmt(size.y)} × ${fmt(size.z)} (파일 단위) · 삼각형 ${Math.round(tris).toLocaleString()}개`;
  V.camera.near=V.radius/100; V.camera.far=V.radius*100; V.camera.updateProjectionMatrix();
  resetView();
  V.pins=clone(link.pins||[]);
  renderSide(); loop();
}
const fmt=n=>n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2);
async function loadGeometry(m,onP){
  const {STLLoader}=V; const loader=new STLLoader();
  if(m.local){ const rec=await idbGet(m.id); return loader.parse(rec.data); }
  return new Promise((res,rej)=>loader.load('models/'+encodeURIComponent(m.file),res,e=>{if(e.total)onP(Math.round(e.loaded/e.total*100));},rej));
}
function resetView(){
  if(!V||!V.radius) return;
  const link=linkFor(V.tid,V.sid);
  if(link&&link.camera){ V.camera.position.fromArray(link.camera.pos); V.controls.target.fromArray(link.camera.target); }
  else { const r=V.radius; V.camera.position.set(r*1.6,-r*2.2,r*1.4); V.controls.target.set(0,0,0); }
  V.controls.update();
}
function resizeViewer(){ if(!V||!V.renderer) return; const w=$('#vcanvasWrap'); const W=w.clientWidth||600,Hh=w.clientHeight||400; V.renderer.setSize(W,Hh,false); V.camera.aspect=W/Hh; V.camera.updateProjectionMatrix(); }
function loop(){
  cancelAnimationFrame(V.raf);
  const tick=()=>{ if(!$('#viewerBg').classList.contains('show')) return; V.controls.update(); V.renderer.render(V.scene,V.camera); drawPins(); V.raf=requestAnimationFrame(tick); };
  tick();
}
function drawPins(){
  const {THREE}=V; const w=$('#vcanvasWrap'); const W=w.clientWidth,Hh=w.clientHeight;
  const pins=V.pins||[]; const host=$('#vPins');
  if(host.children.length!==pins.length) host.innerHTML=pins.map(p=>`<div class="pin">${esc(p.label)}</div>`).join('');
  pins.forEach((p,i)=>{ const v=new THREE.Vector3().fromArray(p.p).project(V.camera); const el=host.children[i];
    el.style.left=((v.x+1)/2*W)+'px'; el.style.top=((1-v.y)/2*Hh)+'px'; el.style.display=v.z<1?'block':'none'; });
}
function onCanvasClick(e){
  if(!V.edit||!V.pinMode) return;
  if(V._down&&Math.hypot(e.clientX-V._down[0],e.clientY-V._down[1])>5) return; // 드래그는 무시
  const {THREE}=V; const r=V.renderer.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,V.camera);
  const hit=ray.intersectObjects(V.meshes,false)[0];
  if(!hit){toast('모델 위를 눌러 주세요');return;}
  const label=(V.pinLabel||'').trim()||`핀 ${(V.pins.length+1)}`; V.pinLabel='';
  V.pins.push({p:hit.point.toArray().map(n=>+n.toFixed(4)),label});
  $('#vPins').innerHTML=''; renderSide(); toast('핀을 찍었습니다. [저장]을 눌러야 반영됩니다.');
}
function renderSide(){
  if(!V.edit){ $('#vside').innerHTML=''; return; }
  const link=linkFor(V.tid,V.sid);
  $('#vside').innerHTML=`<h4>① 시점</h4><div class="meta">원하는 각도로 돌린 뒤 저장하세요. 정비사가 3D를 열면 이 각도로 시작합니다.</div>
    <div class="row"><button class="btn" id="vSaveCam">📌 이 시점 저장</button>${link?.camera?`<button class="btn" id="vClearCam">기본 시점으로</button>`:''}</div>
    <h4>② 표시 핀</h4><div class="meta">이름을 적고 [핀 찍기]를 켠 다음 모델을 누르세요.</div>
    <input type="text" id="pinLabel" placeholder="예: 리벳 열" style="margin-top:6px" value="${esc(V.pinLabel||'')}">
    <div class="row"><button class="btn ${V.pinMode?'on-mode':''}" id="vPinMode">${V.pinMode?'핀 찍는 중… (끄기)':'📍 핀 찍기'}</button></div>
    <div style="margin-top:6px">${(V.pins||[]).map((p,i)=>`<div class="pinrow"><span>📍 ${esc(p.label)}</span><button class="btn cmini" data-delpin="${i}">삭제</button></div>`).join('')||'<div class="meta">핀 없음</div>'}</div>
    <div class="row"><button class="btn primary" id="vSavePins">💾 핀 저장</button></div>
    <h4>③ 모두에게 적용</h4><div class="meta">관리 화면의 [models.json 내보내기]로 받은 파일을 GitHub의 models 폴더에 덮어쓰세요.</div>`;
}
function closeViewer(){ $('#viewerBg').classList.remove('show'); if(document.fullscreenElement) document.exitFullscreen(); cancelAnimationFrame(V?.raf); if(S.role==='admin') render(); }
$('#vClose').onclick=closeViewer;
$('#viewerBg').addEventListener('click',e=>{if(e.target.id==='viewerBg')closeViewer();});
$('#vReset').onclick=()=>resetView();
$('#vWire').onclick=()=>{ if(!V?.meshes) return; V.wire=!V.wire; V.meshes.forEach(m=>m.material.wireframe=V.wire); $('#vWire').classList.toggle('on',V.wire); };
$('#vFull').onclick=()=>{ const el=$('#viewer'); if(document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen?.(); };
$('#vside').addEventListener('input',e=>{ if(e.target.id==='pinLabel') V.pinLabel=e.target.value; });
$('#vside').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='vSaveCam'){ setLink(V.tid,V.sid,{camera:{pos:V.camera.position.toArray().map(n=>+n.toFixed(4)),target:V.controls.target.toArray().map(n=>+n.toFixed(4))}}); renderSide(); toast('시점을 저장했습니다'); }
  if(b.id==='vClearCam'){ const l=clone(linkFor(V.tid,V.sid)); delete l.camera; S.linkEdits[linkKey(V.tid,V.sid)]=l; save(); resetView(); renderSide(); }
  if(b.id==='vPinMode'){ V.pinMode=!V.pinMode; renderSide(); }
  if(b.id==='vSavePins'){ setLink(V.tid,V.sid,{pins:clone(V.pins)}); toast('핀을 저장했습니다'); }
  if(b.dataset.delpin!==undefined){ V.pins.splice(+b.dataset.delpin,1); $('#vPins').innerHTML=''; renderSide(); }
});

/* ===================== 챗봇 (검색형) ===================== */
const PARTICLES=['에서는','에서','으로는','으로','부터','까지','하나요','되나요','나요','까요','인가요','은','는','이','가','을','를','에','로','와','과','도','요','의','좀'];
function norm(s){return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();}
function stem(w){ for(const p of PARTICLES){ if(w.length>p.length+1&&w.endsWith(p)) return w.slice(0,-p.length); } return w; }
function bigrams(s){ const t=s.replace(/\s/g,''); const out=new Set(); for(let i=0;i<t.length-1;i++) out.add(t.slice(i,i+2)); return out; }
function expand(q){
  const n=norm(q); const words=n.split(' ').filter(Boolean).map(stem).filter(w=>w.length>=1);
  const terms=new Set(words);
  for(const g of SYN){ const hit=g.some(x=>n.includes(norm(x))||words.includes(norm(x))); if(hit) g.forEach(x=>terms.add(norm(x))); }
  return {terms:[...terms].filter(w=>w.length>=2||/\d/.test(w)),bg:bigrams(n)};
}
function corpus(){
  const docs=[];
  S.tasks.forEach(t=>t.steps.forEach((s,i)=>{
    docs.push({kind:'step',t,s,i,text:norm(s.title+' '+s.body+' '+s.ref),title:norm(s.title)});
    S.questions.filter(q=>q.taskId===t.id&&q.stepId===s.id&&q.status==='applied').forEach(q=>docs.push({kind:'qa',t,s,i,q,text:norm(q.text+' '+q.answer.text+' '+q.answer.ref),title:norm(s.title)}));
  }));
  return docs;
}
function search(q){
  const {terms,bg}=expand(q); if(!terms.length&&!bg.size) return [];
  return corpus().map(d=>{
    let sc=0; terms.forEach(w=>{ if(d.text.includes(w)) sc+= d.title.includes(w)?3:2; });
    const db=bigrams(d.text); let ov=0; bg.forEach(b=>{if(db.has(b))ov++;}); sc+= bg.size? ov/bg.size*3 : 0;
    if(d.kind==='qa') sc+=0.5;
    return {d,sc};
  }).filter(x=>x.sc>=2.5).sort((a,b)=>b.sc-a.sc);
}
function botSay(html,isHtml){ const b=document.createElement('div'); b.className='bub bot'; if(isHtml) b.innerHTML=html; else b.textContent=html; $('#chatLog').append(b); $('#chatLog').scrollTop=1e9; return b; }
function meSay(t){ const b=document.createElement('div'); b.className='bub me'; b.textContent=t; $('#chatLog').append(b); $('#chatLog').scrollTop=1e9; }
let lastQ='', lastBest=null;
function answer(q){
  lastQ=q; const res=search(q);
  // 같은 Step은 한 번만 (보충설명 우선)
  const seen=new Set(), top=[];
  for(const r of res){ const k=r.d.t.id+'|'+r.d.s.id; if(seen.has(k)) { const ex=top.find(x=>x.k===k); if(r.d.kind==='qa'&&!ex.qa) ex.qa=r.d.q; continue; } seen.add(k); top.push({k,d:r.d,qa:r.d.kind==='qa'?r.d.q:null}); if(top.length===3) break; }
  if(!top.length){
    lastBest=null;
    botSay(`등록된 매뉴얼과 보충설명에서 찾지 못했어요. 추측해서 답하지 않을게요.<br><button class="btn qbtn cmini" data-chatask="1">❓ 감독자에게 질문하기</button>`,true); return;
  }
  lastBest=top[0].d;
  const warn=top.some(x=>x.d.s.caution);
  let h=`관련 단계를 찾았어요${top.length>1?` (${top.length}곳)`:''}.`;
  top.forEach(x=>{ const {t,s,i}=x.d;
    h+=`<div class="hit">${s.caution?`<div class="hw">⚠ ${s.caution==='warning'?'WARNING':'CAUTION'} 단계입니다. 원문 경고를 먼저 확인하세요.</div>`:''}
      <div class="ht" data-goto="${t.id}|${s.id}">Step ${i+1} · ${esc(s.title)}</div>
      <div class="hs">${esc(s.body.split('\n').slice(0,2).join(' '))}</div>
      <div class="hs">근거: ${esc(s.ref)}${S.tasks.length>1?' · '+esc(t.title):''}</div>
      ${x.qa?`<div class="hq">✅ 감독자 보충설명: ${esc(x.qa.answer.text)}</div>`:''}
      ${hasModels(t.id,s.id)?`<button class="btn btn3d cmini" data-chat3d="${t.id}|${s.id}">🧊 3D 보기</button>`:''}
    </div>`; });
  h+=`<button class="btn cmini" data-chatask="1">원하는 답이 아니에요 → 감독자에게 질문</button>`;
  botSay(h,true);
  if(warn){}
}
$('#chatFab').onclick=()=>{ const c=$('#chat'); c.classList.toggle('show'); if(c.classList.contains('show')&&!$('#chatLog').children.length) botSay('무엇이 궁금하세요? 매뉴얼 단계와 승인된 보충설명에서 찾아 드릴게요.\n예: "리벳 홀이 커졌어요", "숍 헤드 크기는?"'); $('#chatIn').focus(); };
$('#chatClose').onclick=()=>$('#chat').classList.remove('show');
$('#chatForm').onsubmit=e=>{ e.preventDefault(); const v=$('#chatIn').value.trim(); if(!v) return; meSay(v); $('#chatIn').value=''; setTimeout(()=>answer(v),150); };
$('#chatLog').addEventListener('click',e=>{
  const el=e.target.closest('[data-goto],[data-chat3d],[data-chatask]'); if(!el) return;
  if(el.dataset.goto){ const [tid,sid]=el.dataset.goto.split('|'); S.role='tech'; S.taskId=tid; save(); render(); const st=$('#step-'+sid); if(st){ st.scrollIntoView({behavior:'smooth',block:'center'}); st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash'); } }
  if(el.dataset.chat3d){ const [tid,sid]=el.dataset.chat3d.split('|'); openViewer(tid,sid,false); }
  if(el.dataset.chatask){ const t=task(); let sid=t.steps[0].id; if(lastBest){ S.taskId=lastBest.t.id; sid=lastBest.s.id; } if(S.role!=='tech'){S.role='tech';save();render();} askModal(sid,'on',lastQ,true); }
});

/* ===================== 이벤트 ===================== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('button,a,[data-zoom],[data-illu]'); if(!el) return;
  if(el.closest('#vside')||el.closest('#chat')||el.closest('#viewer .vhead')) return;
  const d=el.dataset;
  if(el.closest('#roleTabs')&&d.role){S.role=d.role;save();render();return;}
  if(d.close!==undefined){closeModal();return;}
  if(d.zoom!==undefined){const lb=$('#lightbox');lb.innerHTML=`<img src="${el.src}">`;lb.classList.add('show');return;}
  if(d.illu){const lb=$('#lightbox');lb.innerHTML=ILLU[d.illu];lb.classList.add('show');return;}
  if(d.view3d){openViewer(task().id,d.view3d,false);return;}
  if(d.edit3d){openViewer(task().id,d.edit3d,true);return;}
  if(d.ask){askModal(d.ask,d.pos);return;}
  if(d.metoo||d.metooModal){e.preventDefault();const q=S.questions.find(x=>x.id===(d.metoo||d.metooModal));q.metoo++;save();if(d.metooModal){el.textContent='나도 궁금 '+q.metoo;el.disabled=true;}else render();toast('"나도 궁금"이 반영되어 우선순위가 올라갑니다');return;}
  if(d.filter){supFilter=d.filter;render();return;}
  if(d.answer){answerModal(d.answer);return;}
  if(d.manual){manualModal(d.manual);return;}
  if(d.apply){const q=S.questions.find(x=>x.id===d.apply);q.status='applied';save();render();toast('흐름과 챗봇에 반영되었습니다.');return;}
  if(d.unapply){const q=S.questions.find(x=>x.id===d.unapply);q.status='answered';save();render();return;}
  if(d.dellocal){if(confirmDel()){await idbDel(d.dellocal);LOCAL_MODELS=await idbAll();render();}return;}
  const t=task();
  if(d.stepphoto){const p=await pickImages();stepOf(t,d.stepphoto).photos.push(...p);save();render();return;}
  if(d.delphoto){const s=stepOf(t,d.owner);s.photos=s.photos.filter(p=>p.id!==d.delphoto);save();render();return;}
  if(d.noillu){stepOf(t,d.noillu).illu=null;save();render();return;}
  if(d.delstep){if(confirmDel()){t.steps=t.steps.filter(s=>s.id!==d.delstep);S.questions=S.questions.filter(q=>q.stepId!==d.delstep);save();render();}return;}
  if(el.id==='addStep'){t.steps.push({id:uid(),title:'새 단계',body:'',caution:null,ref:'',illu:null,photos:[]});save();render();return;}
  if(el.id==='expManual'){download('manual.json',{tasks:S.tasks});toast('받은 파일을 GitHub의 data 폴더에 덮어쓰세요');return;}
  if(el.id==='expModels'){const loc=effectiveLinks().filter(l=>l.models.some(id=>modelById(id)?.local)); download('models.json',{models:REPO_MODELS,links:effectiveLinks().map(l=>({...l,models:l.models.filter(id=>!modelById(id)?.local)})).filter(l=>l.models.length)}); toast(loc.length?'내 브라우저에만 있는 모델 연결은 빠졌습니다. STL을 models 폴더에 올린 뒤 다시 연결하세요.':'받은 파일을 GitHub의 models 폴더에 덮어쓰세요');return;}
  if(el.id==='expBtn'){download('manual-flow-qa-backup.json',S);return;}
  if(el.id==='impBtn'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{const d2=JSON.parse(fr.result);if(!d2.tasks)throw 0;S=d2;S.linkEdits=S.linkEdits||{};save();render();toast('가져오기 완료');}catch(_){toast('올바른 백업 파일이 아닙니다');}};fr.readAsText(i.files[0]);};i.click();return;}
  if(el.id==='reloadFiles'){if(confirmDel('저장소 파일로 다시 불러오면 이 브라우저에서 고친 단계 내용과 3D 연결이 지워집니다(질문은 유지).')){S.tasks=clone(FILE_TASKS||FALLBACK_TASKS);S.linkEdits={};save();render();toast('저장소 파일로 다시 불러왔습니다');}return;}
});
let armed=null;
function confirmDel(msg){const k=msg||'del';if(armed===k){armed=null;return true;}armed=k;toast((msg||'삭제하려면 한 번 더 누르세요')+(msg?' 한 번 더 누르면 실행합니다.':''));setTimeout(()=>{if(armed===k)armed=null;},3500);return false;}

document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.linkmodel){ const t=task(); const l=linkFor(t.id,d.step); const set=new Set(l?.models||[]); e.target.checked?set.add(d.linkmodel):set.delete(d.linkmodel); setLink(t.id,d.step,{models:[...set]}); render(); toast('3D 연결을 바꿨습니다'); return; }
  if(!d.edit) return;
  const s=stepOf(task(),d.step); s[d.edit]=e.target.value||(d.edit==='caution'?null:''); save(); toast('저장됨');
});
$('#taskSel').addEventListener('change',e=>{S.taskId=e.target.value;save();render();});
$('#lightbox').addEventListener('click',()=>$('#lightbox').classList.remove('show'));

boot();
